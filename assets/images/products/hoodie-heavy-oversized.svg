<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <rect width="600" height="750" fill="#141417"/>

  <!-- Hoodie Silhouette -->
  <g transform="translate(50, 30)">
    <!-- Hood backdrop -->
    <path d="M190 120 C190 40 310 40 310 120 Z" fill="#16161B" stroke="#303036" stroke-width="2"/>
    <path d="M210 120 C210 60 290 60 290 120 Z" fill="#0E0E12"/>

    <!-- Drawstrings -->
    <line x1="225" y1="115" x2="225" y2="210" stroke="#F5F5F5" stroke-width="3" stroke-linecap="round"/>
    <line x1="275" y1="115" x2="275" y2="210" stroke="#F5F5F5" stroke-width="3" stroke-linecap="round"/>
    <rect x="223" y="205" width="4" height="12" fill="#60519b"/>
    <rect x="273" y="205" width="4" height="12" fill="#60519b"/>

    <!-- Sleeves and Heavy Body -->
    <path d="M160 110 L190 120 L310 120 L340 110 L470 210 L410 320 L370 290 L370 580 C370 585 365 590 360 590 L140 590 C135 590 130 585 130 580 L130 290 L90 320 L30 210 Z" 
          fill="#1A1A20" stroke="#303036" stroke-width="2"/>

    <!-- Kangaroo Pocket -->
    <path d="M170 410 L330 410 L350 490 L150 490 Z" fill="#141418" stroke="#303036" stroke-width="1.5"/>
    <line x1="170" y1="410" x2="150" y2="490" stroke="#303036" stroke-width="1.5"/>
    <line x1="330" y1="410" x2="350" y2="490" stroke="#303036" stroke-width="1.5"/>

    <!-- Subtle Graphic Print on Chest -->
    <g transform="translate(200, 240)">
      <text x="50" y="20" fill="#60519b" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="3" text-anchor="middle">SHADOW SYSTEM</text>
      <text x="50" y="35" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="7" letter-spacing="2" text-anchor="middle">HEAVYWEIGHT 400GSM</text>
    </g>

    <!-- Ribbed Cuff & Hem Lines -->
    <line x1="130" y1="570" x2="370" y2="570" stroke="#25252C" stroke-width="2"/>
  </g>

  <!-- Tag -->
  <text x="50" y="710" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">MODEL // HD-01</text>
  <text x="550" y="710" fill="#60519b" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="end">HEAVY HOODIE 400GSM</text>
</svg>
