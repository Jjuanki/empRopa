<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <rect width="600" height="750" fill="#141417"/>
  <!-- Subtle subtle grid pattern -->
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1F1F24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="750" fill="url(#grid1)"/>
  
  <!-- T-shirt silhouette -->
  <g transform="translate(60, 40)">
    <!-- Body -->
    <path d="M160 70 L200 100 C215 110 265 110 280 100 L320 70 L440 145 L380 240 L350 225 L350 560 C350 565 345 570 340 570 L140 570 C135 570 130 565 130 560 L130 225 L100 240 L40 145 Z" 
          fill="#1A1A1F" stroke="#303036" stroke-width="2"/>
    <!-- Collar -->
    <path d="M200 100 C215 110 265 110 280 100 C265 88 215 88 200 100 Z" fill="#141418" stroke="#303036" stroke-width="1.5"/>
    <!-- Fold shadows -->
    <path d="M150 230 Q 180 320 170 560" stroke="#111114" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M330 230 Q 300 320 310 560" stroke="#111114" stroke-width="6" fill="none" opacity="0.6"/>

    <!-- Graphic Artwork: VOID NOISE -->
    <g transform="translate(180, 180)">
      <rect width="120" height="150" fill="#0B0B0D" stroke="#303036" stroke-width="1"/>
      <!-- Soundwave / Glitch bars -->
      <g stroke="#60519b" stroke-width="2" stroke-linecap="round">
        <line x1="20" y1="75" x2="20" y2="75"/>
        <line x1="28" y1="65" x2="28" y2="85"/>
        <line x1="36" y1="50" x2="36" y2="100"/>
        <line x1="44" y1="40" x2="44" y2="110"/>
        <line x1="52" y1="60" x2="52" y2="90"/>
        <line x1="60" y1="30" x2="60" y2="120"/>
        <line x1="68" y1="55" x2="68" y2="95"/>
        <line x1="76" y1="45" x2="76" y2="105"/>
        <line x1="84" y1="65" x2="84" y2="85"/>
        <line x1="92" y1="70" x2="92" y2="80"/>
        <line x1="100" y1="75" x2="100" y2="75"/>
      </g>
      <text x="60" y="135" fill="#F5F5F5" font-family="'Inter', sans-serif" font-size="8" font-weight="700" letter-spacing="2" text-anchor="middle">VOID // NOISE</text>
    </g>

    <!-- Bottom Hem woven label -->
    <rect x="140" y="552" width="28" height="18" fill="#60519b"/>
  </g>

  <!-- Tag / Watermark -->
  <text x="50" y="710" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">MODEL // TEE-01</text>
  <text x="550" y="710" fill="#60519b" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="end">BLACK EDITION</text>
</svg>
