<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <rect width="600" height="750" fill="#141417"/>

  <!-- Cap Silhouette -->
  <g transform="translate(100, 150)">
    <!-- Crown of the Cap (Curved panels) -->
    <path d="M70 280 C60 170 120 90 230 90 C340 90 400 170 390 280 Z" fill="#1A1A20" stroke="#303036" stroke-width="2"/>

    <!-- Panel Seam lines -->
    <path d="M230 90 L230 280" stroke="#2B2B33" stroke-width="2"/>
    <path d="M230 90 C150 140 100 210 85 280" stroke="#2B2B33" stroke-width="1.5"/>
    <path d="M230 90 C310 140 360 210 375 280" stroke="#2B2B33" stroke-width="1.5"/>

    <!-- Eyelets / Ventilation holes -->
    <circle cx="150" cy="180" r="3" fill="#0B0B0D" stroke="#303036" stroke-width="1.5"/>
    <circle cx="230" cy="160" r="3" fill="#0B0B0D" stroke="#303036" stroke-width="1.5"/>
    <circle cx="310" cy="180" r="3" fill="#0B0B0D" stroke="#303036" stroke-width="1.5"/>

    <!-- Button on Top -->
    <ellipse cx="230" cy="90" rx="10" ry="6" fill="#141418" stroke="#303036" stroke-width="1.5"/>

    <!-- Visor / Curved Brim -->
    <path d="M60 280 C60 330 140 360 230 360 C320 360 400 330 400 280 C360 270 230 265 60 280 Z" 
          fill="#141418" stroke="#303036" stroke-width="2"/>
    <path d="M90 300 C150 330 230 335 370 300" stroke="#25252C" stroke-width="2" fill="none"/>

    <!-- Embroidered 3D Monogram Logo -->
    <g transform="translate(195, 190)">
      <rect x="0" y="0" width="70" height="45" rx="4" fill="#0B0B0D" stroke="#303036" stroke-width="1"/>
      <text x="35" y="28" fill="#D4FF3F" font-family="'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="4" text-anchor="middle">TM</text>
      <line x1="12" y1="36" x2="58" y2="36" stroke="#D4FF3F" stroke-width="2"/>
    </g>
  </g>

  <!-- Tag -->
  <text x="50" y="710" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">MODEL // CP-01</text>
  <text x="550" y="710" fill="#D4FF3F" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="end">COTTON TWILL / 3D EMBROIDERY</text>
</svg>
